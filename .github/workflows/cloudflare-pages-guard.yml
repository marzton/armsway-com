name: Cloudflare Workers Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run
      - name: Validate canonical route contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const required = JSON.parse(fs.readFileSync('ops/cloudflare-pages-required.json', 'utf8'));
          const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
          const cfg = JSON.parse(raw.replace(/\/\/.*$/gm, ''));
          if (cfg.name !== required.project_name) throw new Error(`Worker name mismatch: ${cfg.name} != ${required.project_name}`);
          const patterns = new Set((cfg.routes || []).map((r) => r.pattern));
          for (const domain of required.production_domains) {
            const pattern = `${domain}/*`;
            if (!patterns.has(pattern)) throw new Error(`Missing Wrangler route ${pattern}`);
          }
          NODE

  verify-live-routes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate-worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate live Worker routes and domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          python - <<'PY'
          import json, os, urllib.request
          def cf_get(url):
              req = urllib.request.Request(url, headers={'Authorization': f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}", 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode())
              if not data.get('success'):
                  raise SystemExit(f"Cloudflare API error for {url}: {data}")
              return data['result']
          cfg = json.load(open('ops/cloudflare-pages-required.json', 'r', encoding='utf-8'))
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          script = cfg['project_name']
          zones = cf_get(f"https://api.cloudflare.com/client/v4/zones?account.id={account}&per_page=50")
          patterns = set()
          for zone in zones:
              zone_id = zone.get('id')
              if not zone_id:
                  continue
              try:
                  for route in cf_get(f"https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes"):
                      if route.get('script') == script and route.get('pattern'):
                          patterns.add(route['pattern'])
              except Exception as e:
                  print(f"Warning: could not fetch routes for zone {zone_id}: {e}")
          try:
              domains_data = cf_get(f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{script}/domains")
              active_domains = {d['domain'] for d in domains_data}
          except Exception:
              active_domains = set()
          missing = []
          for domain in cfg.get('production_domains', []):
              if f"{domain}/*" not in patterns and domain not in active_domains:
                  missing.append(domain)
          if missing:
              raise SystemExit(f"Missing required Worker routes/domains: {', '.join(missing)}")
          print('Cloudflare Workers live-route guard passed.')
          PY
